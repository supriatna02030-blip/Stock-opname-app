<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Opname K792</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins'} body{background:#f4f7f9; padding:10px; margin:0}
.container{background:white; padding:15px; border-radius:15px; max-width:1300px; margin:auto; overflow-x:auto}
.btn{padding:10px 15px; border:none; border-radius:8px; margin:5px; cursor:pointer; font-weight:600; font-size:14px; display:inline-block}
.btn-back{background:#95a5a6; color:white}.btn-print{background:#27ae60; color:white}
.btn-reset{background:#e74c3c; color:white}.btn-excel{background:#1d6f42; color:white}.btn-gabung{background:#8e44ad; color:white}
.button-group{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px}
.setting{display:flex; gap:10px; margin:15px 0; flex-wrap:wrap; align-items:center}
.setting select,.setting input{padding:8px; border-radius:8px; border:1px solid #ddd; font-weight:600}
.summary{display:flex; gap:10px; margin:15px 0; flex-wrap:wrap}
.card{flex:1; min-width:150px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; padding:15px; border-radius:10px; text-align:center}
.card h3{margin:0; font-size:14px}.card p{margin:5px 0 0; font-size:18px; font-weight:700}
.filter{margin:10px 0} select{padding:8px; border-radius:8px; border:1px solid #ddd}
table{width:100%; border-collapse:collapse; font-size:11px; min-width:1300px} th,td{border:1px solid #ddd; padding:6px; text-align:center; white-space:nowrap}
th{background:#3498db; color:white}.selisih-minus{color:red; font-weight:bold}.selisih-plus{color:green; font-weight:bold}
.badge{background:#e74c3c; color:white; padding:3px 8px; border-radius:20px; font-size:10px}
@media print{.btn,.setting,.filter,.button-group{display:none}}
</style>
</head><body><div class="container">

<div class="button-group">
  <button class="btn btn-back" onclick="window.location.href='login.html'">⬅️ Kembali ke Login</button>
  <button class="btn btn-print" onclick="window.print()">🖨️ Print PDF</button>
  <button class="btn btn-excel" onclick="exportExcel()">📊 Export Excel</button>
  <button class="btn btn-gabung" onclick="gabungHarian()">📅 Gabung Per Hari</button>
  <button class="btn btn-reset" onclick="resetData()">🗑️ Reset</button>
</div>

<h2>📊 LAPORAN STOCK OPNAME K792</h2>

<div class="setting">
  <label><b>Mode Lihat:</b></label>
  <select id="modeLihat" onchange="toggleMode()">
    <option value="perShift">Per Shift</option>
    <option value="perHari">Gabungan Per Hari</option>
  </select>

  <div id="settingShift" style="display:flex; gap:10px">
    <label><b>Pilih Shift:</b></label>
    <select id="pilihLaporanShift" onchange="loadData()">
      <option value="shift1">SHIFT 1 - PAGI</option>
      <option value="shift2">SHIFT 2 - SIANG</option>
      <option value="shift3">SHIFT 3 - MALAM</option>
    </select>
    <input type="date" id="tanggalLaporan" onchange="loadData()">
  </div>

  <div id="settingHari" style="display:none; gap:10px">
    <label><b>Pilih Tanggal:</b></label>
    <input type="date" id="pilihTanggal" onchange="loadDataHarian()">
  </div>
</div>

<p id="judulLaporan" style="font-weight:600; font-size:16px"></p>

<div class="filter">
  <label><b>Filter Kategori: </b></label>
  <select id="filterKat" onchange="renderTable()">
    <option value="SEMUA">SEMUA</option>
  </select>
</div>

<div class="summary">
  <div class="card"><h3>Total Item</h3><p id="totalItem">0</p></div>
  <div class="card"><h3>Selisih Kurang Qty</h3><p id="totalKurang">0</p></div>
  <div class="card"><h3>Selisih Lebih Qty</h3><p id="totalLebih">0</p></div>
  <div class="card"><h3>Total Selisih Rp</h3><p id="totalRp">Rp 0</p></div>
</div>

<div style="overflow-x:auto">
<table id="tabelLaporan"><thead><tr>
<th>No</th><th>Kategori</th><th>Kode</th><th>Nama</th><th>Harga</th><th>OH</th><th>Fisik</th><th>Selisih Qty</th><th>Selisih Rp</th><th>Shift</th><th>PIC</th><th>Status</th>
</tr></thead><tbody></tbody></table>
</div>
</div><script>
let data = [];
let mode = 'perShift';
let currentShift = 'shift1';

const today = new Date().toISOString().split('T')[0];
document.getElementById('tanggalLaporan').value = today;
document.getElementById('pilihTanggal').value = today;

function toggleMode(){
  mode = document.getElementById('modeLihat').value;
  document.getElementById('settingShift').style.display = mode === 'perShift'? 'flex' : 'none';
  document.getElementById('settingHari').style.display = mode === 'perHari'? 'flex' : 'none';
  loadData();
}

function loadData(){
  if(mode === 'perShift'){
    currentShift = document.getElementById('pilihLaporanShift').value;
    const tgl = document.getElementById('tanggalLaporan').value;
    const key = `dataOpname_${currentShift}_${tgl}`;
    data = JSON.parse(localStorage.getItem(key)) || [];
    data = data.map(d => ({...d, shift: currentShift.toUpperCase()}));
    const judul = localStorage.getItem('judulLaporan') || `LAPORAN ${currentShift.toUpperCase()} - ${tgl}`;
    document.getElementById('judulLaporan').innerText = judul;
  }
  isiKategori();
  renderTable();
}

function loadDataHarian(){
  const tgl = document.getElementById('pilihTanggal').value;
  data = [];
  ['shift1','shift2','shift3'].forEach(shift => {
    const key = `dataOpname_${shift}_${tgl}`;
    const dataShift = JSON.parse(localStorage.getItem(key)) || [];
    const dataWithShift = dataShift.map(d => ({...d, shift: shift.toUpperCase()}));
    data = data.concat(dataWithShift);
  });
  document.getElementById('judulLaporan').innerText = `LAPORAN GABUNGAN TANGGAL ${tgl}`;
  isiKategori();
  renderTable();
}

function isiKategori(){
  const filterKat = document.getElementById('filterKat');
  filterKat.innerHTML = '<option value="SEMUA">SEMUA</option>';
  [...new Set(data.map(d=>d.kat))].forEach(k=>{
    filterKat.innerHTML += `<option value="${k}">${k}</option>`
  });
}

function renderTable(){
  const kat = document.getElementById('filterKat').value;
  const filterData = kat === 'SEMUA'? data : data.filter(d=>d.kat===kat);
  const tbody = document.querySelector('#tabelLaporan tbody');
  tbody.innerHTML = '';
  let totalKurang = 0, totalLebih = 0, totalSelisihRp = 0;

  let dataGabungan = [];
  if(mode === 'perHari'){
    const map = {};
    filterData.forEach(d => {
      if(!map[d.kode]){
        map[d.kode] = {...d, fisik: 0, oh: 0, selisih: 0, selisihRp: 0, shift: 'GABUNGAN', pic: '-'};
      }
      map[d.kode].oh += d.oh;
      map[d.kode].fisik += d.fisik;
      map[d.kode].selisih += d.selisih;
      map[d.kode].selisihRp += d.selisihRp;
      if(d.pic) map[d.kode].pic = map[d.kode].pic === '-'? d.pic : map[d.kode].pic + ', ' + d.pic;
    });
    dataGabungan = Object.values(map);
  } else {
    dataGabungan = filterData;
  }

  dataGabungan.forEach((d) => {
    if(d.selisih < 0) totalKurang += d.selisih;
    if(d.selisih > 0) totalLebih += d.selisih;
    totalSelisihRp += d.selisihRp;

    let status = '';
    if(d.selisih == 0) status = '✅';
    else if(d.selisih < 0) status = `RUGI`;
    else status = `LEBIH`;

    tbody.innerHTML += `<tr>
      <td>${d.no}</td><td>${d.kat}</td><td>${d.kode}</td><td style="text-align:left">${d.nama}</td>
      <td>Rp ${d.harga.toLocaleString('id-ID')}</td>
      <td>${d.oh.toFixed(3)}</td><td>${d.fisik.toFixed(3)}</td>
      <td class="${d.selisih < 0? 'selisih-minus' : d.selisih > 0? 'selisih-plus' : ''}">${d.selisih.toFixed(3)}</td>
      <td class="${d.selisihRp < 0? 'selisih-minus' : d.selisihRp > 0? 'selisih-plus' : ''}">Rp ${d.selisihRp.toLocaleString('id-ID')}</td>
      <td><span class="badge">${d.shift}</span></td>
      <td><b>${d.pic || '-'}</b></td>
      <td>${status}</td>
    </tr>`;
  });
  document.getElementById('totalItem').innerText = dataGabungan.length;
  document.getElementById('totalKurang').innerText = totalKurang.toFixed(3);
  document.getElementById('totalLebih').innerText = totalLebih.toFixed(3);
  document.getElementById('totalRp').innerText = 'Rp ' + totalSelisihRp.toLocaleString('id-ID');
  document.getElementById('totalRp').style.color = totalSelisihRp<0?'red':totalSelisihRp>0?'green':'black';
}

function gabungHarian(){
  document.getElementById('modeLihat').value = 'perHari';
  toggleMode();
}

function resetData(){
  const tgl = mode === 'perShift'? document.getElementById('tanggalLaporan').value : document.getElementById('pilihTanggal').value;
  if(mode === 'perShift'){
    if(confirm(`Yakin mau hapus data ${currentShift.toUpperCase()} tanggal ${tgl}?`)){
      localStorage.removeItem(`dataOpname_${currentShift}_${tgl}`);
      loadData();
    }
  } else {
    if(confirm(`Yakin mau hapus SEMUA data 3 shift tanggal ${tgl}?`)){
      localStorage.removeItem(`dataOpname_shift1_${tgl}`);
      localStorage.removeItem(`dataOpname_shift2_${tgl}`);
      localStorage.removeItem(`dataOpname_shift3_${tgl}`);
      loadDataHarian();
    }
  }
}

function exportExcel(){
  if(data.length === 0){ alert('Data kosong!'); return; }
  let csv = 'No,Kategori,Kode,Nama,Harga,OH,Fisik,Selisih Qty,Selisih Rp,Shift,PIC\n';
  data.forEach(d=>{
    csv += `${d.no},${d.kat},${d.kode},"${d.nama}",${d.harga},${d.oh},${d.fisik},${d.selisih},${d.selisihRp},${d.shift},${d.pic||'-'}\n`;
  });
  const tgl = mode === 'perHari'? document.getElementById('pilihTanggal').value : document.getElementById('tanggalLaporan').value;
  const namaFile = mode === 'perHari'? `Laporan_Gabungan_${tgl}.csv` : `Laporan_${currentShift}_${tgl}.csv`;
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = namaFile; a.click();
}

loadData();
</script></body></html>
