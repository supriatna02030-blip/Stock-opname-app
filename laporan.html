<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Opname K792</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#667eea; --bg2:#764ba2; --card:#fff; --text:#2c3e50; --text2:#7f8c8d; --border:#ddd; --hijau:#43e97b; --merah:#ff6b6b
}
body.dark{
  --bg1:#1a1a2e; --bg2:#16213e; --card:#0f3460; --text:#e0e0e0; --text2:#bdbd; --border:#333
}
*{font-family:'Poppins'; box-sizing:border-box; transition:0.3s}
body{background:linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%); padding:15px; margin:0; min-height:100vh}
.container{background:var(--card); padding:15px; border-radius:20px; max-width:900px; margin:auto; box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.header{display:flex; justify-content:space-between; align-items:center; margin-bottom:15px}
h1{color:var(--text); font-size:20px; margin:0}
.toggle{background:none; border:none; font-size:24px; cursor:pointer}
input[type=date]{width:100%; padding:12px; margin:8px 0 15px; border-radius:10px; border:1px solid var(--border); font-size:14px; background:var(--card); color:var(--text)}
.kategori{color:var(--text); font-weight:700; font-size:16px; margin:15px 0 5px; padding:10px; background:var(--border); border-radius:8px}
table{width:100%; border-collapse:collapse; font-size:12px; overflow-x:auto; display:block}
th{background:var(--bg1); color:white; padding:8px; text-align:center; white-space:nowrap}
td{padding:8px; border-bottom:1px solid var(--border); color:var(--text); white-space:nowrap}
td.kanan{text-align:right}
.lebih{color:var(--hijau); font-weight:700}
.kurang{color:var(--merah); font-weight:700}
.total{background:linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color:white; padding:12px; border-radius:10px; text-align:center; font-weight:700; margin:15px 0}
.btn{width:100%; padding:14px; margin:8px 0; border-radius:12px; border:none; font-size:16px; font-weight:700; cursor:pointer; color:white}
.btn-backup{background:linear-gradient(135deg, #fa709a 0%, #fee140 100%)}
.btn-kembali{background:linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%)}
.kosong{text-align:center; color:var(--text2); padding:20px}
</style>
</head><body><div class="container">

<div class="header">
  <h1>📊 Laporan Opname</h1>
  <button class="toggle" onclick="toggleDark()" id="btnDark">🌙</button>
</div>

<input type="date" id="tanggal" onchange="loadLaporan()">

<div id="hasil"></div>

<button class="btn btn-backup" onclick="exportWA()">📤 Export ke WA</button>
<button class="btn btn-kembali" onclick="window.location.href='index.html'">⬅️ Kembali</button>

</div>
<script>
function toggleDark(){
  document.body.classList.toggle('dark');
  let mode = document.body.classList.contains('dark')? 'dark' : 'light';
  localStorage.setItem('theme', mode);
  document.getElementById('btnDark').innerText = mode === 'dark'? '☀️' : '🌙';
}
if(localStorage.getItem('theme') === 'dark'){
  document.body.classList.add('dark');
  document.getElementById('btnDark').innerText = '☀️';
}

document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
loadLaporan();

// MASTER OH + HARGA VERSI LAMA
const masterOH = {
  '417806':{oh:0, harga:0}, '417804':{oh:0, harga:0}, '417805':{oh:0, harga:0}, '423992':{oh:0, harga:0},
  '435578':{oh:0, harga:0}, '435736':{oh:0, harga:0}, '465771':{oh:0, harga:0}, '428660':{oh:0, harga:0},
  '428662':{oh:0, harga:0}, '443704':{oh:0, harga:0}, 'EB001':{oh:0, harga:0}, 'EB002':{oh:0, harga:0},
  'EB003':{oh:0, harga:0}, 'FM001':{oh:0, harga:0}, 'FM002':{oh:0, harga:0}, 'FM003':{oh:0, harga:0}
};

function formatRupiah(angka){
  return new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', minimumFractionDigits:0}).format(angka);
}

function loadLaporan(){
  const tgl = document.getElementById('tanggal').value;
  const data = JSON.parse(localStorage.getItem(`dataOpname_${tgl}`) || '[]');
  const div = document.getElementById('hasil');

  if(data.length === 0){
    div.innerHTML = `<div class="kosong">Belum ada data untuk tanggal ${tgl}</div>`;
    return;
  }

  let grouped = {};
  let totalSelisih = 0;
  let totalRupiah = 0;

  data.forEach(item => {
    if(!grouped[item.kategori]) grouped[item.kategori] = [];
    grouped[item.kategori].push(item);
  });

  let html = '';
  for(let kat in grouped){
    html += `<div class="kategori">📦 ${kat}</div>
    <table>
      <tr><th>PLU</th><th>NAMA</th><th>OH</th><th>FISIK</th><th>SELISIH</th><th>RP</th></tr>`;

    grouped[kat].forEach(item => {
      let oh = masterOH[item.plu]?.oh || 0;
      let harga = masterOH[item.plu]?.harga || 0;
      let selisih = item.fisik - oh;
      let rp = selisih * harga;
      totalSelisih += selisih;
      totalRupiah += rp;

      let classSelisih = selisih > 0? 'lebih' : selisih < 0? 'kurang' : '';
      let tanda = selisih > 0? '+' : '';

      html += `<tr>
        <td>${item.plu}</td>
        <td>${item.nama}</td>
        <td class="kanan">${oh}</td>
        <td class="kanan">${item.fisik}</td>
        <td class="kanan ${classSelisih}">${tanda}${selisih}</td>
        <td class="kanan ${classSelisih}">${formatRupiah(rp)}</td>
      </tr>`;
    });
    html += `</table>`;
  }

  html = `<div class="total">TOTAL SELISIH: ${totalSelisih} | TOTAL RP: ${formatRupiah(totalRupiah)}</div>` + html;
  div.innerHTML = html;
}

function exportWA(){
  const tgl = document.getElementById('tanggal').value;
  const data = JSON.parse(localStorage.getItem(`dataOpname_${tgl}`) || '[]');
  if(data.length === 0){alert('Data kosong'); return;}

  let text = `Akhir pembuka/akhir shift \n${tgl}\n_Plu / desc / oh / fisik / selisih\n`;
  let grouped = {};
  data.forEach(item => {
    if(!grouped[item.kategori]) grouped[item.kategori] = [];
    grouped[item.kategori].push(item);
  });

  for(let kat in grouped){
    text += `_*${kat}*_\n`;
    grouped[kat].forEach(item => {
      let oh = masterOH[item.plu]?.oh || 0;
      let selisih = item.fisik - oh;
      let tanda = selisih > 0? '+' : selisih < 0? '' : '✅';
      let selisihTxt = selisih === 0? '✅' : tanda + selisih;
      text += `- ${item.plu} / ${item.nama} /${oh}/${item.fisik}${selisihTxt}\n`;
    });
    text += `\n`;
  }

  navigator.clipboard.writeText(text);
  alert('✅ Data berhasil di copy! Tinggal paste ke WA');
}
</script>
</body></html>
