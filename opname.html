const tbody = document.querySelector('#tabelOpname tbody');
dataBarang.forEach(d=>{
  tbody.innerHTML += `<tr>
    <td>${d.no}</td><td>${d.kat}</td><td>${d.kode}</td><td>${d.nama}</td>
    <td><input type="number" id="oh${d.no}" value="${d.oh}" readonly></td>
    <td><input type="number" id="fisik${d.no}" value="0" oninput="hitung(${d.no})"></td>
    <td>${d.harga.toLocaleString('id-ID')}</td>
    <td id="selisih${d.no}">0</td>
    <td id="selisihRp${d.no}">0</td>
  </tr>`;
});

function hitung(no){
  const oh = parseInt(document.getElementById('oh'+no).value) || 0;
  const fisik = parseInt(document.getElementById('fisik'+no).value) || 0;
  const barang = dataBarang.find(b=>b.no===no);
  const selisih = fisik - oh;
  const selisihRp = selisih * barang.harga;
  document.getElementById('selisih'+no).innerText = selisih;
  document.getElementById('selisihRp'+no).innerText = selisihRp.toLocaleString('id-ID');
  document.getElementById('selisih'+no).style.color = selisih<0?'red':selisih>0?'green':'black';
  document.getElementById('selisihRp'+no).style.color = selisihRp<0?'red':selisihRp>0?'green':'black';
}

function simpanData(){
  const hasil = dataBarang.map(d=>{
    const fisik = parseInt(document.getElementById('fisik'+d.no).value) || 0;
    const selisih = fisik - d.oh;
    return {...d, fisik, selisih, selisihRp: selisih * d.harga};
  });
  localStorage.setItem('dataOpname', JSON.stringify(hasil));
  window.location.href='laporan.html';
}

// load data lama kalau ada
const dataLama = JSON.parse(localStorage.getItem('dataOpname')) || [];
dataLama.forEach(d=>{
  const input = document.getElementById('fisik'+d.no);
  if(input){ input.value = d.fisik; hitung(d.no); }
});
