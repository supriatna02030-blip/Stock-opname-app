<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Opname K792</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#667eea; --bg2:#764ba2; --card:#fff; --text:#2c3e50; --text2:#7f8c8d; --border:#ddd
}
body.dark{
  --bg1:#1a1a2e; --bg2:#16213e; --card:#0f3460; --text:#e0e0e0; --text2:#bdbd; --border:#333
}
*{font-family:'Poppins'; box-sizing:border-box; transition:0.3s}
body{background:linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%); padding:15px; margin:0; min-height:100vh}
.container{background:var(--card); padding:20px; border-radius:20px; max-width:650px; margin:auto; box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.header{display:flex; justify-content:space-between; align-items:center; margin-bottom:15px}
h1{color:var(--text); font-size:20px; margin:0}
.toggle{background:none; border:none; font-size:24px; cursor:pointer}
input[type=date]{width:100%; padding:12px; margin:8px 0 15px; border-radius:10px; border:1px solid var(--border); font-size:14px; background:var(--card); color:var(--text)}
.kategori{color:var(--text); font-weight:700; font-size:15px; margin:15px 0 5px; padding:8px; background:var(--border); border-radius:8px}
.item{background:var(--card); border:1px solid var(--border); padding:12px; border-radius:12px; margin:8px 0; display:flex; justify-content:space-between; align-items:center}
.item b{color:var(--text); font-size:13px; font-weight:600}
.item input{width:90px; padding:8px; border-radius:8px; border:1px solid var(--border); text-align:center; background:var(--card); color:var(--text)}
.btn{width:100%; padding:14px; margin:8px 0; border-radius:12px; border:none; font-size:16px; font-weight:700; cursor:pointer; color:white}
.btn-simpan{background:linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)}
.btn-kembali{background:linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%)}
</style>
</head><body><div class="container">

<div class="header">
  <h1>📝 Input Opname K792</h1>
  <button class="toggle" onclick="toggleDark()" id="btnDark">🌙</button>
</div>

<input type="date" id="tanggal">

<div id="listItem"></div>

<button class="btn btn-simpan" onclick="simpanData()">💾 Simpan Data</button>
<button class="btn btn-kembali" onclick="window.location.href='index.html'">⬅️ Kembali</button>

</div>
<script>
// DARK MODE
function toggleDark(){
  document.body.classList.toggle('dark');
  let mode = document.body.classList.contains('dark')? 'dark' : 'light';
  localStorage.setItem('theme', mode);
  document.getElementById('btnDark').innerText = mode === 'dark'? '☀️' : '🌙';
}
if(localStorage.getItem('theme') === 'dark'){
  document.body.classList.add('dark');
  document.getElementById('btnDark').innerText = '☀️';
}

// Set tanggal hari ini otomatis
document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

// MASTER DATA SEMUA ITEM
const masterData = [
  // KATEGORI MINYAK
  {kategori:'MINYAK', plu:'113079', nama:'Tropical myk grg pet 2L'},
  {kategori:'MINYAK', plu:'451350', nama:'Tropical myk grg pet 1,5L'},
  {kategori:'MINYAK', plu:'61132', nama:'Tropical myk grg pet 1L'},
  {kategori:'MINYAK', plu:'195673', nama:'Sania mnyk grg pch 1L'},
  {kategori:'MINYAK', plu:'211141', nama:'Bimoli myk pch grg 1L'},
  {kategori:'MINYAK', plu:'6965', nama:'Barco myk grg pch 1L'},
  {kategori:'MINYAK', plu:'244111', nama:'SunCo myk grg pch 2L'},
  {kategori:'MINYAK', plu:'156747', nama:'Filma myk grg pch 2L'},
  {kategori:'MINYAK', plu:'192730', nama:'Bimoli myk grg pch 2L'},
  {kategori:'MINYAK', plu:'113222', nama:'Fortune myk grg pch 2L'},
  {kategori:'MINYAK', plu:'195674', nama:'Sania myk grg pch 2L'},
  {kategori:'MINYAK', plu:'211378', nama:'Bimoli myk grg spesial pch 2L'},
  {kategori:'MINYAK', plu:'121905', nama:'Sovia myk grg pch 2L'},
  {kategori:'MINYAK', plu:'437794', nama:'Harumnas myk grg pch 2L'},
  {kategori:'MINYAK', plu:'433436', nama:'Camar myk grg pch 2L'},
  {kategori:'MINYAK', plu:'123332', nama:'Alfamart myk grg pch 2L'},
  {kategori:'MINYAK', plu:'453308', nama:'Vipco myk 2L'},
  {kategori:'MINYAK', plu:'45258', nama:'Merah pth myk 2L'},
  {kategori:'MINYAK', plu:'436397', nama:'Ikan dorang myk grng kelapa'},
  
  // KATEGORI FROZEN FOOD DARI GAMBAR
  {kategori:'FROZEN', plu:'417806', nama:'KANZLER SINGLE'},
  {kategori:'FROZEN', plu:'417804', nama:'KANZLER SINGLE'},
  {kategori:'FROZEN', plu:'417805', nama:'KANZLER SINGLE'},
  {kategori:'FROZEN', plu:'423992', nama:'KANZLER SINGLE'},
  {kategori:'FROZEN', plu:'435578', nama:'KANZLER SINGLE'},
  {kategori:'FROZEN', plu:'435736', nama:'KANZLER BAKSO'},
  {kategori:'FROZEN', plu:'465771', nama:'KANZLER BAKSO'},
  {kategori:'FROZEN', plu:'428660', nama:'KANZLER BAKSO'},
  {kategori:'FROZEN', plu:'428662', nama:'KANZLER BAKSO'},
  {kategori:'FROZEN', plu:'443704', nama:'FIESTA SOSIS'},
  
  // KATEGORI LAIN
  {kategori:'LAINK', plu:'EB001', nama:'ECO BAG'},
  {kategori:'LAINK', plu:'EB002', nama:'ECO BAG'},
  {kategori:'LAINK', plu:'EB003', nama:'ECO BAG'},
  {kategori:'LAINK', plu:'FM001', nama:'FRESH MILK'},
  {kategori:'LAINK', plu:'FM002', nama:'FRESH MILK'},
  {kategori:'LAINK', plu:'FM003', nama:'FRESH MILK'}
];

// Tampilkan item per kategori
function loadItem(){
  let html = '';
  let katSekarang = '';
  masterData.forEach(item => {
    if(katSekarang!== item.kategori){
      katSekarang = item.kategori;
      html += `<div class="kategori">📦 ${katSekarang}</div>`;
    }
    html += `<div class="item">
      <b>${item.plu} - ${item.nama}</b>
      <input type="number" id="fisik_${item.plu}" placeholder="0" min="0">
    </div>`;
  });
  document.getElementById('listItem').innerHTML = html;
}
loadItem();

// Simpan ke localStorage
function simpanData(){
  const tgl = document.getElementById('tanggal').value;
  let data = [];
  masterData.forEach(item => {
    let fisik = document.getElementById(`fisik_${item.plu}`).value;
    if(fisik!== '' && fisik > 0){
      data.push({plu:item.plu, nama:item.nama, kategori:item.kategori, fisik:parseInt(fisik)});
    }
  });
  if(data.length === 0){alert('Isi minimal 1 item dulu bro'); return;}
  localStorage.setItem(`dataOpname_${tgl}`, JSON.stringify(data));
  alert(`✅ Data ${tgl} berhasil disimpan! Total ${data.length} item`);
  window.location.href = 'index.html';
}
</script>
</body></html>
