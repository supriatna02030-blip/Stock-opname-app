const tbody = document.querySelector('#tabelOpname tbody');
daftarBarang.forEach((d) => {
  tbody.innerHTML += `<tr>
    <td>${d.no}</td><td>${d.kat}</td><td>${d.kode}</td><td style="text-align:left">${d.nama}</td>
    <td>${d.oh}</td>
    <td><input type="number" id="fisik${d.no}" value="0" oninput="hitung(${d.no}, ${d.oh}, ${d.harga})"></td>
    <td>${d.harga.toLocaleString('id-ID')}</td>
    <td id="selisih${d.no}">0</td>
    <td id="selisihRp${d.no}">0</td>
  </tr>`;
});

function hitung(no, oh, harga){
  let fisik = parseInt(document.getElementById('fisik'+no).value) || 0;
  let selisih = fisik - oh;
  let selisihRp = selisih * harga;
  document.getElementById('selisih'+no).innerText = selisih;
  document.getElementById('selisih'+no).className = selisih < 0 ? 'selisih-minus' : selisih > 0 ? 'selisih-plus' : '';
  document.getElementById('selisihRp'+no).innerText = selisihRp.toLocaleString('id-ID');
  document.getElementById('selisihRp'+no).className = selisihRp < 0 ? 'selisih-minus' : selisihRp > 0 ? 'selisih-plus' : '';
}

function simpanData(){
  let data = [];
  daftarBarang.forEach((d) => {
    let fisik = parseInt(document.getElementById('fisik'+d.no).value) || 0;
    let selisih = fisik - d.oh;
    data.push({...d, fisik, selisih, selisihRp: selisih * d.harga});
  });
  localStorage.setItem('dataOpname', JSON.stringify(data));
  window.location.href = "laporan.html";
}
