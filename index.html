<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Opname K792</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins'} body{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
.login-box{background:white; padding:30px; border-radius:15px; width:90%; max-width:450px; box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h2{text-align:center; color:#e74c3c}
input,select{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box}
.btn{width:100%; padding:12px; border:none; border-radius:8px; background:#27ae60; color:white; font-weight:600; font-size:16px; cursor:pointer; margin-top:10px}
.btn-admin{background:#8e44ad}.btn-danger{background:#e74c3c}.hidden{display:none}.error{color:red; text-align:center; margin-top:10px}
.user-list{margin-top:20px; border-top:1px solid #eee; padding-top:15px; max-height:200px; overflow-y:auto}
.user-item{display:flex; justify-content:space-between; align-items:center; padding:8px; background:#f4f7f9; border-radius:5px; margin:5px 0; font-size:14px}
.user-item button{padding:5px 10px; font-size:12px; border:none; border-radius:5px; cursor:pointer; background:#e74c3c; color:white}
</style>
</head><body><div class="login-box">

<h2>📊 LOGIN OPNAME K792</h2>

<div id="loginForm">
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button class="btn" onclick="login()">LOGIN</button>
  <p class="error" id="errorMsg"></p>
</div>

<div id="adminPanel" class="hidden">
  <h3>👑 Panel Admin</h3>
  <input type="text" id="newUser" placeholder="Username Baru">
  <input type="password" id="newPass" placeholder="Password Baru">
  <select id="newRole">
    <option value="user">Staff/User</option>
    <option value="admin">Admin</option>
  </select>
  <button class="btn btn-admin" onclick="tambahUser()">+ TAMBAH USER</button>

  <div class="user-list">
    <h4>Daftar User:</h4>
    <div id="listUser"></div>
  </div>
  <button class="btn" style="background:#3498db" onclick="masukOpname()">MASUK KE APLIKASI</button>
  <button class="btn btn-danger" onclick="logout()">LOGOUT</button>
</div>

<div id="userPanel" class="hidden">
  <h3>Halo, <span id="namaUser"></span> 👋</h3>
  <p>Role: <b>Staff</b></p>
  <button class="btn" onclick="masukOpname()">MASUK INPUT OPNAME</button>
  <button class="btn btn-danger" onclick="logout()">LOGOUT</button>
</div>

</div><script>
if(!localStorage.getItem('users')){
  const defaultUsers = [
    {user: 'admin', pass: 'admin123', role: 'admin'},
    {user: 'budi', pass: '123', role: 'user'},
    {user: 'ani', pass: '123', role: 'user'}
  ];
  localStorage.setItem('users', JSON.stringify(defaultUsers));
}

function login(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const users = JSON.parse(localStorage.getItem('users'));
  const found = users.find(x => x.user === u && x.pass === p);

  if(found){
    localStorage.setItem('loginUser', JSON.stringify(found));
    document.getElementById('loginForm').classList.add('hidden');
    if(found.role === 'admin'){
      document.getElementById('adminPanel').classList.remove('hidden');
      loadUserList();
    } else {
      document.getElementById('userPanel').classList.remove('hidden');
      document.getElementById('namaUser').innerText = found.user.toUpperCase();
    }
  } else {
    document.getElementById('errorMsg').innerText = 'Username / Password salah!';
  }
}

function tambahUser(){
  const u = document.getElementById('newUser').value;
  const p = document.getElementById('newPass').value;
  const r = document.getElementById('newRole').value;
  if(!u ||!p){ alert('Isi semua!'); return; }

  const users = JSON.parse(localStorage.getItem('users'));
  if(users.find(x => x.user === u)){ alert('Username sudah ada!'); return; }

  users.push({user:u, pass:p, role:r});
  localStorage.setItem('users', JSON.stringify(users));
  alert('User berhasil ditambah!');
  document.getElementById('newUser').value = '';
  document.getElementById('newPass').value = '';
  loadUserList();
}

function resetPassword(user){
  const newPass = prompt(`Masukkan password baru untuk ${user}:`);
  if(!newPass){ return; }

  let users = JSON.parse(localStorage.getItem('users'));
  const idx = users.findIndex(x => x.user === user);
  if(idx!== -1){
    users[idx].pass = newPass;
    localStorage.setItem('users', JSON.stringify(users));
    alert(`Password ${user} berhasil di reset!`);
  }
}

function loadUserList(){
  const users = JSON.parse(localStorage.getItem('users'));
  const div = document.getElementById('listUser');
  div.innerHTML = '';
  users.forEach(x => {
    div.innerHTML += `<div class="user-item">
      <span>${x.user} - <b>${x.role}</b></span>
      <div>
        ${x.user!== 'admin'? `<button style="background:#3498db; margin-right:5px" onclick="resetPassword('${x.user}')">Reset Pass</button>` : ''}
        ${x.user!== 'admin'? `<button onclick="hapusUser('${x.user}')">Hapus</button>` : ''}
      </div>
    </div>`;
  });
}

function hapusUser(user){
  if(confirm('Hapus user '+user+'?')){
    let users = JSON.parse(localStorage.getItem('users'));
    users = users.filter(x => x.user!== user);
    localStorage.setItem('users', JSON.stringify(users));
    loadUserList();
  }
}

function masukOpname(){
  window.location.href = 'opname.html';
}

function logout(){
  localStorage.removeItem('loginUser');
  document.getElementById('adminPanel').classList.add('hidden');
  document.getElementById('userPanel').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}
</script></body></html>
