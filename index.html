<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login SO K792</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins'} body{background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0}
.container{background:white; padding:25px; border-radius:20px; width:90%; max-width:400px; text-align:center}
input,button{width:100%; padding:12px; margin:6px 0; border:2px solid #eee; border-radius:10px; box-sizing:border-box}
.btn-menu{padding:18px; font-size:18px; color:white; border:none; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)}
</style>
</head>
<body>
<div class="container">
  <h2>🔐 LOGIN SO K792</h2>
  <input type="text" id="inputNIK" placeholder="NIK Karyawan">
  <input type="password" id="inputPIN" placeholder="PIN">
  <button class="btn-menu" onclick="login()">Login</button>
  <p id="loginError" style="color:red"></p>
</div>
<script>
function login(){ 
  if(document.getElementById('inputNIK').value==="ADMIN" && document.getElementById('inputPIN').value==="1234"){ 
    localStorage.setItem('userLogin', 'ADMIN');
    window.location.href = "home.html"; 
  } else document.getElementById('loginError').innerText='NIK/PIN Salah!'; 
}
</script>
</body>
</html>
