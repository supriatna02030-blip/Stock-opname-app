<style>
*{font-family:'Poppins', sans-serif}
body{background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px; transition:0.3s}

#toast{position:fixed; top:-60px; left:50%; transform:translateX(-50%); background:#27ae60; color:#fff; padding:12px 25px; border-radius:20px; transition: top 0.4s; z-index:999; font-weight:600}
#toast.show{top:20px}
.page{display:none}.page.active{display:block; animation: slideUp 0.3s ease-out;}
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.header-toko{text-align:center; padding:15px; margin-bottom:15px; border-bottom:2px solid #eee}
.header-toko img{width:70px; height:70px; border-radius:15px; margin-bottom:8px; background:#fff; padding:5px}
.header-toko h1{margin:5px 0; font-size:22px; color:#2980b9}
body.dark.header-toko h1{color:#00f2fe}
.btn-menu{margin:10px 0; padding:18px; font-size:18px; width:100%; color:white; border:none; border-radius:10px; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)}
.btn-aksi{background:#27ae60; width:auto; padding:10px 15px; margin:5px; color:white; border:none; border-radius:10px}
.btn-back{background:#7f8c8d; width:auto; padding:10px 15px; margin:10px 0; color:white; border:none; border-radius:10px}
.btn-pdf{background:#e67e22; width:auto; padding:10px 15px; margin:5px; color:white; border:none; border-radius:10px}
.btn-wa{background:#25D366; width:auto; padding:10px 15px; margin:5px; color:white; border:none; border-radius:10px}
.btn-dark{position:fixed; top:20px; right:20px; width:50px; height:50px; border-radius:50%; font-size:20px; z-index:999; padding:0}
input,button,select{width:100%; padding:12px; margin:6px 0; border:2px solid #eee; border-radius:10px}
table{width:100%; border-collapse:collapse; margin-top:10px; font-size:12px}
th{background:#2980b9; color:white; padding:8px; position:sticky; top:0}
td{padding:8px; border-bottom:1px solid #ddd; text-align:center}
body.dark td{border-color:#333}
.selisih-minus{color:red; font-weight:700; animation: blink 0.8s infinite;}
.selisih-plus{color:green; font-weight:700; animation: blink 0.8s infinite;}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.dashboard{display:flex; gap:10px; margin:20px 0; flex-wrap:wrap}
.dash-card{flex:1; min-width:110px; padding:15px; border-radius:15px; text-align:center; color:white}

.card-minus{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.card-rugi{background:linear-gradient(135deg,#f39c12,#e67e22)}
#formTambah{background:#f8f9fa; padding:15px; border-radius:10px; margin-top:10px}
body.dark #formTambah{background:#2c3e50}
</style>

<body>

<script>
const { jsPDF } = window.jspdf;
let dataBarang = [];
let users = [{nik:"ADMIN", pin:"1234", nama:"ADMIN", role:"admin"}];
let userLogin = null;

function showMenu(menu) {
  document.querySelectorAll('.page').forEach(p => {p.classList.remove('active'); p.style.display = 'none';});
  let target = document.getElementById('menu' + menu.charAt(0).toUpperCase() + menu.slice(1));
  target.style.display = 'block';
  setTimeout(()=> target.classList.add('active'), 10);
  if(menu === 'laporan') tampilkanRekapSelisih();
  if(menu === 'dashboard') updateDashboard();
}
function showToast(pesan="✅ Data Tersimpan"){const t=document.getElementById('toast'); t.innerText=pesan; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000);}
window.onload = function(){ document.getElementById('tanggalOpname').valueAsDate = new Date(); }

function updateSalam(){
  const jam = new Date().getHours();
  const hari = new Date().toLocaleDateString('id-ID', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
  let salam = "";
  
  if(jam >= 5 && jam < 11){ salam = "☀️ Selamat Pagi"; }
  else if(jam >= 11 && jam < 15){ salam = "🌤️ Selamat Siang"; }
  else if(jam >= 15 && jam < 18){ salam = "🌇 Selamat Sore"; }
  else{ salam = "🌙 Selamat Malam"; }
  
  document.getElementById('salam').innerText = salam;
  document.getElementById('tanggalHariIni').innerText = hari;
}

function login(){ 
  if(document.getElementById('inputNIK').value==="ADMIN" && document.getElementById('inputPIN').value==="1234"){ 
    userLogin={role:'admin',nama:'ADMIN'}; 
    document.getElementById('loginPage').style.display='none'; 
    document.getElementById('mainApp').style.display='block'; 
    document.getElementById('namaUser').innerText='ADMIN'; 
    updateSalam();
    showMenu('home'); 
  } else document.getElementById('loginError').innerText='NIK/PIN Salah!'; 
}
function logout(){ location.reload(); }
function toggleDark(){ document.body.classList.toggle('dark'); }

function showFormTambah(){ document.getElementById('formTambah').style.display = 'block'; }
function hideFormTambah(){ document.getElementById('formTambah').style.display = 'none'; }
function simpanItemManual(){
  let itemBaru = {
    kategori: document.getElementById('inKat').value.toUpperCase(),
    kode: document.getElementById('inKode').value,
    nama: document.getElementById('inNama').value.toLowerCase(),
    oh: document.getElementById('inOH').value,
    fisik: "0",
    harga: document.getElementById('inHarga').value
  };
  if(!itemBaru.kode || !itemBaru.nama) return alert("Kode & Nama wajib diisi!");
  dataBarang.push(itemBaru); tampilkan(); hideFormTambah(); showToast(`✅ ${itemBaru.nama} ditambah`);
  document.getElementById('inKat').value = ''; document.getElementById('inKode').value = ''; document.getElementById('inNama').value = '';
}

const templateShift = [

function loadItems(){ dataBarang = templateShift.map(item => ({...item})); tampilkan(); showToast("📥 43 Item Dimuat"); }
function updateOH(i,val){dataBarang[i].oh=val; tampilkan();}
function updateFisik(i,val){dataBarang[i].fisik=val; tampilkan();}
function updateHarga(i,val){dataBarang[i].harga=val; tampilkan();}
function tampilkan(){
  let container=document.getElementById('tabelContainer'); container.innerHTML='';
  let kategoriList = [...new Set(dataBarang.map(x => x.kategori))];
  let totalOH=0; let totalFisik=0;
  kategoriList.forEach(kat => {
    let html = `<h3>${kat}</h3><table><tr><th>No</th><th>Kode</th><th>Nama</th><th>OH</th><th>Fisik</th><th>Harga</th><th>Selisih</th><th>Selisih Rp</th></tr>`;
    let no=1;
    dataBarang.filter(x => x.kategori === kat).forEach((item) => {
      let index = dataBarang.indexOf(item);
      totalOH+=Number(item.oh)||0; totalFisik+=Number(item.fisik)||0;
      let selisih=(Number(item.fisik)||0)-(Number(item.oh)||0); let selisihRp = selisih * (Number(item.harga)||0);
      let classSelisih=selisih>0?'selisih-plus':selisih<0?'selisih-minus':'';
      html+=`<tr><td>${no++}</td><td>${item.kode}</td><td style="text-align:left">${item.nama}</td>
      <td><input type="number" value="${item.oh}" onchange="updateOH(${index},this.value)" style="width:60px"></td>
      <td><input type="number" value="${item.fisik}" onchange="updateFisik(${index},this.value)" style="width:60px"></td>
      <td><input type="number" value="${item.harga}" onchange="updateHarga(${index},this.value)" style="width:80px"></td>
      <td class="${classSelisih}">${selisih}</td><td class="${classSelisih}">Rp ${selisihRp.toLocaleString()}</td></tr>`;
    });
    html+=`</table>`; container.innerHTML += html;
  });
  document.getElementById('totalStok').innerHTML=`Total Item: ${dataBarang.length} | OH: ${totalOH} | Fisik: ${totalFisik}`;
}
function updateDashboard(){
  let minus = dataBarang.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  let totalRugi = 0; minus.forEach(m => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); totalRugi += kurang * (Number(m.harga)||0); });
  document.getElementById('dashTotal2').innerText = dataBarang.length;
  document.getElementById('dashMinus2').innerText = minus.length;
  document.getElementById('dashRugi2').innerText = 'Rp ' + totalRugi.toLocaleString();
}
function tampilkanRekapSelisih(){
  let minus = dataBarang.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  let html = '';
  if(minus.length > 0){
    html += `<h3>❌ REKAP BARANG MINUS: ${minus.length} Item</h3>`;
    minus.forEach((m,i) => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); let rugi = kurang * (Number(m.harga)||0); html += `<p>${i+1}. ${m.nama} - Kurang <b>${kurang}</b> = <b>Rp ${rugi.toLocaleString()}</b></p>`; });
  }
  document.getElementById('rekapSelisih').innerHTML = html;
}
function simpanOpname(){ localStorage.setItem('so', JSON.stringify(dataBarang)); showToast(); }
function kirimRekapWA(){
  let minus = dataBarang.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  if(minus.length===0) return alert('Tidak ada barang minus!');
  let pesan = `*REKAP MINUS SO K792*\nTanggal: ${document.getElementById('tanggalOpname').value}\n\n`;
  minus.forEach((m,i) => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); let rugi = kurang * (Number(m.harga)||0); pesan += `${i+1}. ${m.nama} - Kurang ${kurang} = Rp ${rugi.toLocaleString()}\n`; });
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`);
}
function exportPDF(){
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text("LAPORAN STOCK OPNAME K792", 105, 15, {align:"center"});
  let y = 30; let minus = dataBarang.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0)); let totalRugi=0;
  doc.setFontSize(12); doc.text("REKAP BARANG MINUS", 14, y); y+=10;
  minus.forEach((m,i) => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); let rugi = kurang * (Number(m.harga)||0); totalRugi+=rugi; doc.text(`${i+1}. ${m.nama} - Kurang ${kurang} = Rp ${rugi.toLocaleString()}`, 14, y); y+=7; });
  doc.text(`TOTAL RUGI: Rp ${totalRugi.toLocaleString()}`, 14, y+5);
  doc.save(`LAPORAN_SO_K792.pdf`); showToast("✅ PDF Download");
}
</script>
