<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Opname K792</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins'} body{background:#f4f7f9; padding:15px} 
.container{background:white; padding:20px; border-radius:15px; max-width:1200px; margin:auto}
.btn-back{padding:10px 15px; background:#95a5a6; color:white; border:none; border-radius:8px; margin-bottom:15px}
table{width:100%; border-collapse:collapse; margin-top:10px} th,td{border:1px solid #ddd; padding:8px; text-align:center}
th{background:#3498db; color:white} input{width:90%; padding:5px; text-align:center}
.btn-save{padding:12px; width:100%; background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color:white; border:none; border-radius:10px; margin-top:15px; font-size:16px}</style>
</head><body><div class="container">
<button class="btn-back" onclick="window.location.href='home.html'">⬅️ Kembali ke Home</button>
<h2>📝 Input Stock Opname K792</h2>
<table id="tabelOpname"><thead><tr><th>No</th><th>Nama Barang</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th></tr></thead><tbody></tbody></table>
<button class="btn-save" onclick="simpanData()">💾 Simpan & Ke Laporan</button>
</div><script>
const daftarBarang = ["Roti Tawar", "Susu UHT", "Air Mineral", "Mie Instan", "Sabun Mandi"]; // isi 43 barang kamu disini
const tbody = document.querySelector('#tabelOpname tbody');
daftarBarang.forEach((nama, i) => {
  tbody.innerHTML += `<tr><td>${i+1}</td><td>${nama}</td><td><input type="number" id="sistem${i}" value="0"></td><td><input type="number" id="fisik${i}" value="0"></td><td id="selisih${i}">0</td></tr>`;
});
function simpanData(){
  let data = [];
  daftarBarang.forEach((nama, i) => {
    let sistem = parseInt(document.getElementById('sistem'+i).value) || 0;
    let fisik = parseInt(document.getElementById('fisik'+i).value) || 0;
    data.push({nama, sistem, fisik, selisih: fisik-sistem});
  });
  localStorage.setItem('dataOpname', JSON.stringify(data));
  window.location.href = "laporan.html";
}
</script></body></html>
